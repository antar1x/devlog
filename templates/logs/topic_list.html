{% extends 'base.html' %}
{% block content %}
    <h1>My topics</h1>

    <p>
        <a href="{% url 'topic_create' %}">Add new topic</a>
    </p>

    <ul>
        {% for topic in topics %}
            <li>{{ topic.name }}</li>
        {% empty %}
            <li>No topics yet.</li>
        {% endfor %}
    </ul>

    <p>
        <a href="{% url 'home' %}">Back home</a>
    </p>
{% endblock %}
