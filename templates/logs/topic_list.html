{% extends 'base.html' %}

{% block title %}DevLog - Topics{% endblock %}

{% block content %}
<section class="page-head">
    <div>
        <p class="eyebrow">Topics</p>
        <h1>My topics</h1>
        <p class="muted">Group your learning into clear tracks.</p>
    </div>
    <a class="button" href="{% url 'topic_create' %}">Add topic</a>
</section>

<ul class="list">
    {% for topic in topics %}
        <li class="item-card">
            <strong>{{ topic.name }}</strong>
        </li>
    {% empty %}
        <li class="empty">No topics yet.</li>
    {% endfor %}
</ul>
{% endblock %}
