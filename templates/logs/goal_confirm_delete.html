{% extends 'base.html' %}

{% block title %}DevLog - Delete Goal{% endblock %}

{% block content %}
<section class="form-panel">
    <p class="eyebrow">Confirm delete</p>
    <h1>Delete goal</h1>
    <p class="muted">This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button class="danger" type="submit">Delete</button>
            <a class="button secondary" href="{% url 'goal_list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
