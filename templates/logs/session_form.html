{% extends 'base.html' %}

{% block title %}DevLog - Session{% endblock %}

{% block content %}
<section class="page-head">
    <div>
        <p class="eyebrow">Session</p>
        <h1>Add study session</h1>
    </div>
</section>

<section class="form-panel">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Save</button>
            <a class="button secondary" href="{% url 'session_list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
