{% extends 'base.html' %}

{% block title %}DevLog - Register{% endblock %}

{% block content %}
<section class="page-head">
    <div>
        <p class="eyebrow">Start tracking</p>
        <h1>Create account</h1>
    </div>
</section>

<section class="form-panel">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Register</button>
            <a class="button secondary" href="{% url 'login' %}">Login</a>
        </div>
    </form>
</section>
{% endblock %}
