{% extends 'base.html' %}

{% block title %}DevLog - Profile Settings{% endblock %}

{% block content %}
<section class="page-head">
    <div>
        <p class="eyebrow">Profile</p>
        <h1>Settings</h1>
        <p class="muted">Control how your public DevLog profile appears.</p>
    </div>
    {% if user.is_authenticated %}
        <a class="button secondary" href="{% url 'public_profile' user.username %}">View public profile</a>
    {% endif %}
</section>

<section class="form-panel">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Save settings</button>
            <a class="button secondary" href="{% url 'profile_info' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
