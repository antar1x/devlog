{% extends 'base.html' %}

{% block title %}DevLog - Login{% endblock %}

{% block content %}
<section class="page-head">
    <div>
        <p class="eyebrow">Welcome back</p>
        <h1>Login</h1>
    </div>
</section>

<section class="form-panel">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Login</button>
            <a class="button secondary" href="{% url 'register' %}">Register</a>
        </div>
    </form>
</section>
{% endblock %}
