{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevLog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <nav class="nav" aria-label="Primary navigation">
                <a class="brand" href="{% url 'home' %}">
                    <span class="brand-mark">DL</span>
                    <span>DevLog</span>
                </a>
                <div class="nav-links">
                    {% if user.is_authenticated %}
                        <a href="{% url 'dashboard' %}">Dashboard</a>
                        <a href="{% url 'session_list' %}">Sessions</a>
                        <a href="{% url 'topic_list' %}">Topics</a>
                        <a href="{% url 'goal_list' %}">Goals</a>
                        <a href="{% url 'profile_info' %}">Profile</a>
                        <a href="{% url 'profile_settings' %}">Settings</a>
                    {% else %}
                        <a href="{% url 'login' %}">Login</a>
                        <a href="{% url 'register' %}">Register</a>
                    {% endif %}
                    <a href="{% url 'profiles' %}">Search</a>
                </div>
            </nav>
        </header>

        <main class="container">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
