databases:
  - name: devlog-db
    plan: free
    databaseName: devlog
    user: devlog

services:
  - type: web
    plan: free
    name: devlog
    runtime: python
    buildCommand: bash build.sh
    startCommand: python -m gunicorn DevLog.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devlog-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
